name: Deploy to GitHub Pages

# เผยแพร่เว็บทุกครั้งที่ push เข้า main (หรือสั่งเองจากแท็บ Actions)
# ต้องตั้งค่าครั้งเดียว: Settings > Pages > Build and deployment > Source = "GitHub Actions"
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build

      # เผยแพร่เฉพาะไฟล์ที่เว็บใช้จริง (index.html, privacy.html, places/, assets/, sitemap.xml, robots.txt): ไม่รวม source-models/ (ไฟล์ต้นฉบับโมเดลขนาดใหญ่), src/, tools/, i18n/,
      # และไฟล์สำรองสำหรับ file:// (assets/model/offline) ที่ใช้เฉพาะตอนเปิดไฟล์โดยตรงบนเครื่อง
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html privacy.html sitemap.xml robots.txt _site/
          cp -r places _site/places
          cp -r assets _site/assets
          rm -rf _site/assets/model/offline
          touch _site/.nojekyll
          echo "Site size:" && du -sh _site && find _site -type f | wc -l

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
